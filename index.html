<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TubeForum</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #272b35; --text: #e8eaf0;
    --muted: #8b91a1; --accent: #ff4d4d; --accent2: #4da3ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent2); text-decoration: none; }
  header { display: flex; gap: 16px; align-items: center; padding: 12px 24px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  input, textarea, button { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent2); }
  button { cursor: pointer; background: var(--panel); }
  button:hover { border-color: var(--accent2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .add { display: flex; gap: 8px; margin-bottom: 24px; }
  .add input { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    display: block; color: inherit; }
  .card:hover { border-color: var(--accent2); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .card .info { padding: 10px 12px; }
  .card .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .watch { display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
  @media (max-width: 900px) { .watch { grid-template-columns: 1fr; } }
  .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
  .player iframe, .player #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
  h2 { margin: 16px 0 4px; font-size: 20px; }
  .side h3 { margin: 0 0 12px; font-size: 16px; }
  .side .item { display: flex; gap: 10px; margin-bottom: 12px; color: inherit; }
  .side .item img { width: 140px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; }
  .side .item .t { font-size: 14px; font-weight: 600; }
  .comments { margin-top: 24px; }
  .comments form { display: grid; gap: 8px; margin-bottom: 20px; }
  .comments .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .comments .row input[type=text] { width: 160px; }
  .comment { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 10px; }
  .comment .head { color: var(--muted); font-size: 13px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .comment .head b { color: var(--text); }
  .comment .del { margin-left: auto; padding: 0 8px; font-size: 12px; }
  .ts { background: #1c2a3d; border: 1px solid #2a4163; border-radius: 6px; padding: 0 6px;
    color: var(--accent2); cursor: pointer; font-weight: 600; }
  .muted { color: var(--muted); }
  .toolbar { display: flex; gap: 8px; }
  .toolbar button { font-size: 13px; padding: 6px 10px; }
</style>
</head>
<body>
<header>
  <h1><a href="#/" style="color:inherit">Tube<span>Forum</span></a></h1>
  <div class="spacer"></div>
  <div class="toolbar">
    <button id="btnExport" title="Baixa um backup JSON de tudo">Exportar</button>
    <button id="btnImport" title="Restaura um backup JSON">Importar</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
</header>
<main id="app"></main>

<script>
/* ============ Dados (sem banco: localStorage) ============ */
const KEY = 'tubeforum_v1';
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { videos: [], comments: {} }; }
  catch { return { videos: [], comments: {} }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
let db = load();

/* ============ Utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

function parseVideoId(input) {
  input = input.trim();
  if (/^[\w-]{11}$/.test(input)) return input;
  try {
    const u = new URL(input);
    if (u.hostname === 'youtu.be') return u.pathname.slice(1, 12);
    if (u.hostname.endsWith('youtube.com')) {
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]{11})/);
      if (m) return m[2];
    }
  } catch {}
  return null;
}
const thumb = id => `https://img.youtube.com/vi/${id}/mqdefault.jpg`;

async function fetchTitle(id) {
  try {
    const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
    const j = await r.json();
    if (j.title) return { title: j.title, author: j.author_name || '' };
  } catch {}
  return { title: 'Vídeo ' + id, author: '' };
}

function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}
function parseTime(str) {
  const p = str.split(':').map(Number);
  return p.reduce((a, n) => a * 60 + n, 0);
}
// Transforma "1:23" e "01:02:03" no texto em links clicáveis
function renderText(text) {
  return esc(text).replace(/\b(\d{1,2}:)?\d{1,2}:\d{2}\b/g,
    m => `<span class="ts" data-t="${parseTime(m)}">${m}</span>`);
}

/* ============ YouTube IFrame API ============ */
let ytReady = new Promise(res => {
  if (window.YT && YT.Player) return res();
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
});
let player = null;

/* ============ Telas ============ */
function renderHome() {
  player = null;
  $('#app').innerHTML = `
    <form class="add" id="addForm">
      <input id="url" placeholder="Cole o link de um vídeo do YouTube..." required>
      <button class="primary">Adicionar</button>
    </form>
    <div id="list"></div>`;
  $('#addForm').onsubmit = async e => {
    e.preventDefault();
    const id = parseVideoId($('#url').value);
    if (!id) return alert('Link inválido. Cole uma URL do YouTube.');
    if (db.videos.some(v => v.id === id)) { location.hash = '#/v/' + id; return; }
    const btn = $('#addForm button'); btn.disabled = true; btn.textContent = 'Buscando...';
    const info = await fetchTitle(id);
    db.videos.unshift({ id, title: info.title, channel: info.author, addedAt: Date.now() });
    save();
    location.hash = '#/v/' + id;
  };
  const list = $('#list');
  if (!db.videos.length) {
    list.innerHTML = '<div class="empty">Nenhum vídeo ainda. Cole um link acima para começar.</div>';
    return;
  }
  list.innerHTML = '<div class="grid">' + db.videos.map(v => `
    <a class="card" href="#/v/${v.id}">
      <img src="${thumb(v.id)}" alt="" loading="lazy">
      <div class="info">
        <div class="title">${esc(v.title)}</div>
        <div class="meta">${esc(v.channel || '')} · ${(db.comments[v.id] || []).length} comentários</div>
      </div>
    </a>`).join('') + '</div>';
}

async function renderWatch(id) {
  const video = db.videos.find(v => v.id === id) || { id, title: 'Vídeo ' + id, channel: '' };
  const others = db.videos.filter(v => v.id !== id);
  $('#app').innerHTML = `
    <div class="watch">
      <div>
        <div class="player"><div id="yt"></div></div>
        <h2>${esc(video.title)}</h2>
        <div class="muted">${esc(video.channel || '')}
          · <a href="#" id="rm">remover da lista</a></div>
        <section class="comments">
          <h3 id="ccount"></h3>
          <form id="cForm">
            <div class="row">
              <input type="text" id="author" placeholder="Seu nome" maxlength="30" required>
              <label class="muted"><input type="checkbox" id="useTime"> marcar o tempo atual do vídeo</label>
            </div>
            <textarea id="ctext" rows="3" placeholder="Comente. Dica: escreva 1:23 e vira link para aquele momento." required></textarea>
            <div><button class="primary">Comentar</button></div>
          </form>
          <div id="clist"></div>
        </section>
      </div>
      <aside class="side">
        <h3>Outros vídeos</h3>
        ${others.map(v => `<a class="item" href="#/v/${v.id}">
          <img src="${thumb(v.id)}" alt="" loading="lazy"><div class="t">${esc(v.title)}</div></a>`).join('')
          || '<div class="muted">Adicione mais vídeos na página inicial.</div>'}
      </aside>
    </div>`;

  await ytReady;
  if (location.hash !== '#/v/' + id) return; // usuário já navegou
  player = new YT.Player('yt', { videoId: id, playerVars: { rel: 0, modestbranding: 1 } });

  $('#author').value = localStorage.getItem('tubeforum_author') || '';
  $('#rm').onclick = e => {
    e.preventDefault();
    if (!confirm('Remover este vídeo e seus comentários?')) return;
    db.videos = db.videos.filter(v => v.id !== id);
    delete db.comments[id];
    save(); location.hash = '#/';
  };
  $('#cForm').onsubmit = e => {
    e.preventDefault();
    const author = $('#author').value.trim(), text = $('#ctext').value.trim();
    if (!author || !text) return;
    localStorage.setItem('tubeforum_author', author);
    let t = null;
    if ($('#useTime').checked && player && player.getCurrentTime) t = Math.floor(player.getCurrentTime());
    (db.comments[id] ||= []).unshift({ id: uid(), author, text, t, at: Date.now() });
    save();
    $('#ctext').value = '';
    drawComments(id);
  };
  $('#clist').onclick = e => {
    const ts = e.target.closest('.ts');
    if (ts && player) { player.seekTo(+ts.dataset.t, true); player.playVideo(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    const del = e.target.closest('.del');
    if (del) {
      db.comments[id] = db.comments[id].filter(c => c.id !== del.dataset.id);
      save(); drawComments(id);
    }
  };
  drawComments(id);
}

function drawComments(id) {
  const list = db.comments[id] || [];
  $('#ccount').textContent = list.length + (list.length === 1 ? ' comentário' : ' comentários');
  $('#clist').innerHTML = list.map(c => `
    <div class="comment">
      <div class="head"><b>${esc(c.author)}</b>
        ${c.t != null ? `<span class="ts" data-t="${c.t}">${fmtTime(c.t)}</span>` : ''}
        <span>${new Date(c.at).toLocaleString('pt-BR')}</span>
        <button class="del" data-id="${c.id}" title="Apagar">×</button></div>
      <div>${renderText(c.text).replace(/\n/g, '<br>')}</div>
    </div>`).join('') || '<div class="muted">Seja o primeiro a comentar.</div>';
}

/* ============ Roteamento ============ */
function route() {
  const m = location.hash.match(/^#\/v\/([\w-]{11})$/);
  window.scrollTo(0, 0);
  m ? renderWatch(m[1]) : renderHome();
}
window.addEventListener('hashchange', route);
route();

/* ============ Backup (já que não há banco) ============ */
$('#btnExport').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = 'tubeforum-backup.json'; a.click();
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.videos) || typeof j.comments !== 'object') throw 0;
    db = j; save(); route();
  } catch { alert('Arquivo de backup inválido.'); }
  e.target.value = '';
};
</script>
</body>
</html>
